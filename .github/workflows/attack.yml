# エンジンを変えたら妨害テストが全部通ることを機械で確かめる。
# 「通ることの確認だけでは、何も見ていない可能性を排除できない」ため、
# このリポジトリの検査は最初から全件が妨害ケース（落ちるべきものが落ちるか）。
name: attack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: エンジンの妨害テスト
        run: python3 attack/engine_attack_test.py

      - name: 関門の集計（飛ばした条件を緑にしないか）
        run: python3 attack/gate_skip_test.py

      - name: push 前のフック（削除を飛ばすか・握り潰していないか）
        run: python3 attack/prepush_test.py

      - name: 書き出し器のひな形（figma.mixed で落ちないか）
        run: node attack/preamble_test.mjs

      - name: 設定が無い・壊れているときに全道具が止まるか
        run: python3 attack/broken_input_test.py

      # **self-test があっても、その経路を試していなければ壊しても気づかない。**
      # 各道具の「落とす」帰り道を1本ずつ潰して self-test が赤くなるかを見る
      # （2026-09-05 実測: 185本のうち 88本＝47% が素通りだった）。
      # 素通りは attack/mutation-allow.json に理由が無ければ落ちる
      - name: 変異試験（落とす帰り道を self-test が見ているか）
        run: python3 attack/mutation_test.py

      - name: 発火ログの項目表（実装と合っているか）
        run: python3 tools/readme_check.py --log-schema

      - name: 関門の条件（正本と生成物のズレ）
        run: python3 tools/gen_gate.py --check
      - name: ツールの構文
        run: python3 -m py_compile engine/design_check.py tools/*.py shims/*.py

      # **一覧を手で書かない**（2026-09-02）。それまで5本を手で並べており、
      # 道具が22本に増えても**17本の self-test が CI で一度も走っていなかった**。
      # このリポジトリが繰り返し潰してきた「手で保守する一覧が古くなる」の、
      # ハーネス自身での再発。
      # **Windows でだけ落ちる書き方**を Linux ランナーから見つける。
      # 検査そのものが macOS でしか回っていなかったため、aub では3日で5件出た
      # （うち2件は「Windows 非互換を見つけるための検査」自身のバグ）。
      - name: 移植性（Windows でだけ落ちる書き方）
        run: python3 tools/portable_check.py --root tools

      # cp932 の端末を作って全道具を回す。**絵文字を print した瞬間に死ぬ**のを
      # Windows を用意せずに捕まえる（MacBook Air で再現を実測済み）。
      - name: 出力の文字コード（cp932 の端末で全道具）
        env:
          PYTHONIOENCODING: cp932
        run: |
          FAILED=0
          for f in tools/*.py; do
            case "$(basename "$f")" in _*) continue;; esac
            grep -q '"--self-test"' "$f" || continue
            if python3 "$f" --self-test 2>&1 | grep -q "UnicodeEncodeError"; then
              echo "  **cp932 で死ぬ**: $f" >&2; FAILED=1
            fi
          done
          exit $FAILED

      - name: 検査自身の self-test（全道具）
        run: |
          set -u
          FAILED=0; RAN=0; NONE=""
          for f in tools/*.py; do
            grep -q "def self_test" "$f" || { NONE="$NONE $(basename $f)"; continue; }
            RAN=$((RAN + 1))
            python3 "$f" --self-test || FAILED=1
          done
          echo "self-test を持つ道具: $RAN 本 / 持たない道具:$NONE"
          if [ "$RAN" -eq 0 ]; then
            echo "self-test を1本も走らせていません。**空振りです。**" >&2
            exit 1
          fi
          exit $FAILED

      # **持っているだけでは何も証明していない。** 本体を何行通るかを見る
      # （2026-09-02。fingerprint_parity が 11% で、main() を1行も
      #  通っていなかったのがこれで判明した）
      - name: self-test の中身の厚さ
        run: |
          python3 tools/stage_check.py --verify ci/verify.sh.template \
            --tools tools --min-coverage 50

      # **README の一覧がディスクと合っているか**（2026-09-02）。
      # 実測で 27本中5本が README に無かった。README は人が読む地図なので、
      # 古くなると「その道具は無い」と誤解される
      - name: README の一覧が実在と合っているか
        run: python3 tools/readme_check.py

      # **課題は Issue に集める。** 宣言があるのに Issue が無いものを知らせる
      #（作るのは人が --apply を回したときだけ）
      - name: 課題の台帳（Issue の無い課題）
        run: python3 tools/issue_sync.py --check --root .

      - name: 案内しているパスが実在するか
        # 上流なので design/ は「取り込む側」のパス。除外して自分のパスだけ見る
        run: python3 tools/ci_path_check.py --sources '**/*.py' '**/*.md' 'ci/*' --ignore 'design/' 'tools/ghost' 'tools/gone' 'tools/real'

      - name: __pycache__ が追跡されていないこと
        run: |
          if git ls-files | grep -q '__pycache__'; then
            echo ".pyc が追跡されています（取り込む側の pull が止まります）" >&2
            git ls-files | grep '__pycache__' >&2
            exit 1
          fi
          echo "OK: .pyc は追跡されていません" 
